<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบสรุปงานโครงการ</title>
<style>
  :root{
    --bg:#F5F6F8;
    --panel:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6572;
    --line:#E4E7EC;
    --brand:#2B5CAB;
    --brand-dark:#1E4685;
    --brand-soft:#EAF0FA;
    --ok:#1E9E6B;
    --ok-soft:#E4F7EE;
    --warn:#C98A1A;
    --warn-soft:#FCF1DD;
    --bad:#C0392B;
    --bad-soft:#FBEAE8;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Sarabun","Noto Sans Thai","Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  .app{max-width:1220px;margin:0 auto;padding:28px 20px 60px;}

  /* Header */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:22px;flex-wrap:wrap;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:9px;
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:15px;flex-shrink:0;
  }
  .brand h1{font-size:19px;margin:0;font-weight:700;}
  .brand p{margin:0;font-size:12.5px;color:var(--ink-soft);}

  .tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:10px;border:1px solid var(--line);}
  .tab-btn{
    border:none;background:transparent;padding:9px 18px;border-radius:7px;
    font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;
    transition:.15s;
  }
  .tab-btn.active{background:var(--brand);color:#fff;}
  .tab-btn:not(.active):hover{background:var(--brand-soft);color:var(--brand-dark);}

  .view{display:none;}
  .view.active{display:block;}

  /* Overview cards */
  .ov-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .ov-head h2{margin:0;font-size:17px;}
  .ov-summary{font-size:13px;color:var(--ink-soft);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .pcard{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 16px;cursor:pointer;transition:.15s;
  }
  .pcard:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(43,92,171,.10);}
  .pcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
  .pcard-top h3{margin:0;font-size:15.5px;font-weight:700;}
  .pcard-pct{font-size:20px;font-weight:800;color:var(--brand);white-space:nowrap;}
  .bar-track{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:14px;}
  .bar-fill{height:100%;border-radius:6px;background:var(--brand);transition:width .3s;}
  .pcard-rows{display:flex;flex-direction:column;gap:7px;}
  .prow-wrap{display:flex;flex-direction:column;}
  .prow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}
  .prow .lbl{width:108px;flex-shrink:0;}
  .prow .mini-track{flex:1;height:5px;border-radius:4px;background:var(--line);overflow:hidden;}
  .prow .mini-fill{height:100%;border-radius:4px;}
  .prow .val{width:34px;text-align:right;flex-shrink:0;color:var(--ink);font-weight:600;}
  .doc-counts{font-size:11px;color:var(--ink-soft);margin:3px 0 0 116px;}

  .empty{
    background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);
    padding:40px 20px;text-align:center;color:var(--ink-soft);
  }
  .empty b{color:var(--ink);}

  /* Buttons */
  .btn{
    border:none;border-radius:8px;padding:9px 16px;font-family:inherit;font-size:13.5px;
    font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;
  }
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--brand);color:var(--brand-dark);}
  .btn-danger-text{background:transparent;color:var(--bad);padding:6px 8px;font-size:12.5px;}
  .btn-danger-text:hover{text-decoration:underline;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}

  /* Project detail */
  .proj-select-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  select, input[type=text], input[type=number], input[type=date], textarea{
    font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;
    padding:9px 11px;background:#fff;color:var(--ink);
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand);}
  #projectSelect{min-width:220px;font-weight:600;}

  .detail-header{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin-bottom:18px;
  }
  .detail-header-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
  .detail-header-top h2{margin:0 0 4px;font-size:18px;}
  .budget-line{font-size:12.5px;color:var(--brand-dark);font-weight:600;margin-top:4px;}
  .budget-line-sm{font-size:11.5px;color:var(--brand-dark);font-weight:600;margin-top:2px;}
  .detail-pct-wrap{display:flex;align-items:center;gap:10px;}
  .detail-pct{font-size:28px;font-weight:800;color:var(--brand);}

  .section{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 6px;margin-bottom:16px;
  }
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:8px;}
  .section-head h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;}
  .section-count{font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--bg);padding:3px 9px;border-radius:20px;}

  .add-row{
    display:flex;gap:8px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:10px;
  }
  .add-row input, .add-row select{flex:1;min-width:130px;}
  .add-row input[name=name]{flex:2;min-width:180px;}

  .excel-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:4px;}
  .excel-hint{font-size:12px;color:var(--ink-soft);}
  .search-row{display:flex;align-items:center;gap:8px;padding:12px 0;margin-bottom:4px;}
  .search-row input{flex:1;min-width:220px;}
  th{ position:relative; }
  .col-resizer{position:absolute;top:0;right:-3px;bottom:0;width:8px;cursor:col-resize;user-select:none;touch-action:none;z-index:2;}
  .col-resizer:hover, .col-resizer.resizing{background:var(--brand);opacity:0.5;}
  table{table-layout:auto;}

  table{width:100%;border-collapse:collapse;margin-bottom:14px;}
  th{
    text-align:left;font-size:12px;color:var(--ink-soft);font-weight:600;
    padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  td{padding:9px 8px;border-bottom:1px solid #EEF0F3;font-size:13.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td select{font-size:12.5px;padding:5px 8px;}
  td input[type=text]{font-size:13px;padding:5px 8px;width:100%;border:1px solid transparent;background:transparent;}
  td input[type=text]:hover, td input[type=text]:focus{border-color:var(--line);background:#fff;}
  td input[type=number]{width:100%;font-size:13px;padding:5px 8px;}
  td input[type=date]{font-size:12.5px;padding:5px 6px;width:100%;}
  .col-del{width:36px;text-align:center;}
  .col-seq{width:30px;color:var(--ink-soft);font-weight:600;text-align:center;}

  .status-badge{
    display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;
    border:none;white-space:nowrap;
  }
  .st-done{background:var(--ok-soft);color:var(--ok);}
  .st-prog{background:var(--warn-soft);color:var(--warn);}
  .st-none{background:var(--bad-soft);color:var(--bad);}

  .no-items{padding:18px 4px;color:var(--ink-soft);font-size:13px;text-align:center;}
  tr.row-missing-po td{background:var(--bad-soft);}
  tr.row-missing-po:hover td{background:#f7d9d5;}

  /* Document category blocks */
  .doc-cat{border:1px solid var(--line);border-radius:9px;padding:14px 14px 4px;margin:0 0 16px;background:#FCFCFD;}
  .doc-cat-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .doc-cat-head h4{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .group-toggle{background:none;border:none;cursor:pointer;font-size:12px;color:var(--ink-soft);padding:0;line-height:1;}
  .group-toggle:hover{color:var(--brand);}
  .doc-cat-head .tag{font-size:11.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:3px 9px;border-radius:20px;}
  .doc-cats-empty{padding:22px 4px 26px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .doc-add-cat-row{display:flex;justify-content:flex-end;padding:2px 0 16px;}
  .add-agency-panel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .add-agency-panel select, .add-agency-panel input{flex:1;min-width:160px;}

  .pending-box{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);}
  .pending-title{font-size:11.5px;font-weight:700;color:var(--warn);margin-bottom:6px;}
  .pending-row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-soft);padding:2px 0;}
  .pending-row span:first-child{font-weight:600;color:var(--ink);}

  .reply-cell{min-width:150px;}
  .reply-toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;user-select:none;white-space:nowrap;}
  .reply-toggle input{margin:0;}
  .reply-fields{display:flex;flex-direction:column;gap:4px;margin-top:6px;}
  .reply-fields input[type=text]{font-size:12px;padding:4px 6px;}
  .reply-fields input[type=date]{font-size:11.5px;padding:4px 6px;}

  .checklist-group-cell{font-weight:700;color:var(--ink);vertical-align:top;border-right:1px solid #EEF0F3;background:var(--bg);font-size:13px;}
  .checklist-status-group{display:flex;gap:5px;flex-wrap:nowrap;}
  .chk-status-btn{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:16px;cursor:pointer;white-space:nowrap;}
  .chk-status-btn:hover{border-color:var(--brand);color:var(--brand-dark);}
  .chk-status-btn.chk-yes-active{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700;}
  .chk-status-btn.chk-no-active{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:700;}

  /* Modal */
  .modal-bg{
    display:none;position:fixed;inset:0;background:rgba(20,26,36,.45);
    align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal-bg.active{display:flex;}
  .modal{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:380px;}
  .modal h3{margin:0 0 14px;font-size:16px;}
  .modal input{width:100%;margin-bottom:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.25s;z-index:100;
  }
  .toast.show{opacity:1;transform:translate(-50%,-4px);}

  .footnote{font-size:12px;color:var(--ink-soft);margin-top:24px;text-align:center;}

  @media(max-width:640px){
    .prow .lbl{width:78px;}
    .detail-header-top{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">PJ</div>
      <div>
        <h1>ระบบสรุปงานโครงการ</h1>
        <p>เอกสาร · ขออนุญาตเข้าพื้นที่ · ของที่ซื้อ/เข้า</p>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="overview">ภาพรวมทุกโครงการ</button>
      <button class="tab-btn" data-tab="detail">รายละเอียดโครงการ</button>
    </div>
  </div>

  <!-- OVERVIEW -->
  <div class="view active" id="view-overview">
    <div class="ov-head">
      <h2>ความคืบหน้าแต่ละโครงการ</h2>
      <div style="display:flex;align-items:center;gap:14px;">
        <span class="ov-summary" id="ovSummary"></span>
        <button class="btn btn-primary btn-sm" id="btnNewProjectOv">+ เพิ่มโครงการ</button>
      </div>
    </div>
    <div class="grid" id="overviewGrid"></div>
  </div>

  <!-- DETAIL -->
  <div class="view" id="view-detail">
    <div class="proj-select-row">
      <select id="projectSelect"></select>
      <button class="btn btn-primary btn-sm" id="btnNewProjectDetail">+ เพิ่มโครงการ</button>
      <button class="btn btn-ghost btn-sm" id="btnDeleteProject">ลบโครงการนี้</button>
    </div>

    <div id="detailContent"></div>
  </div>

  <div class="footnote">ข้อมูลถูกบันทึกและใช้ร่วมกันโดยทุกคนที่เปิดหน้านี้</div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">ชื่อโครงการใหม่</h3>
    <input type="text" id="modalInput" placeholder="">
    <input type="number" step="0.01" id="modalBudgetInput" placeholder="ยอดเงินโครงการ (บาท) — ไม่ระบุก็ได้" style="display:none;">
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" id="btnCancelModal">ยกเลิก</button>
      <button class="btn btn-primary btn-sm" id="btnConfirmModal">ยืนยัน</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let state = { projects: [] };
let currentProjectId = null;
let modalMode = 'project'; // 'project' | 'docCategory'
let collapsedPurchaseGroups = new Set();
let purchaseSearchQuery = '';
let colWidthsDoc = {};
let colWidthsPermit = {};
let colWidthsPurchase = {};

const PURCHASE_FIELDS = ['prNo','matName','prQty','prOthQty','poQty','unit','poNo','poReceive'];
const PURCHASE_FIELD_META = {
  prNo:      { label:'PR No.',      type:'text',   header:'PR No.' },
  matName:   { label:'Mat.Name',    type:'text',   header:'Mat.Name' },
  prQty:     { label:'PR QTY',      type:'number', header:'PR QTY' },
  prOthQty:  { label:'PR OTH QTY',  type:'number', header:'PR OTH QTY' },
  poQty:     { label:'P/O QTY',     type:'number', header:'P/O QTY' },
  unit:      { label:'Unit',        type:'text',   header:'Unit' },
  poNo:      { label:'PO No.',      type:'text',   header:'PO No.' },
  poReceive: { label:'PO Receive',  type:'number', header:'PO Receive' },
};

const AGENCY_TYPES = [
  { key:'highway',         label:'กรมทางหลวง',                  fields:['road','docNumber','sentDate','installment','amount','permitDoc','permitDate','note'] },
  { key:'rural_highway',   label:'กรมทางหลวงชนบท',              fields:['road','docNumber','sentDate','installment','amount','permitDoc','permitDate','note'] },
  { key:'special_highway', label:'กรมทางหลวงพิเศษ',              fields:['road','docNumber','sentDate','installment','amount','permitDoc','permitDate','note'] },
  { key:'ptt',              label:'ปตท.',                        fields:['docNumber','sentDate','installment','amount','permitDoc','permitDate','note'] },
  { key:'irrigation',       label:'กรมชลประทาน',                  fields:['docNumber','sentDate','installment','amount','permitDoc','permitDate','note'] },
  { key:'local_admin',      label:'องค์การบริหารส่วนท้องถิ่น',      fields:['localName','docNumber','sentDate','permitDoc','permitDate','note'] },
  { key:'other',            label:'หน่วยงานอื่นๆ',                 fields:['orgName','docNumber','sentDate','installment','amount','permitDoc','permitDate','note'] },
];

const PERMIT_FIELD_META = {
  road:        { label:'หมายเลขถนน',    type:'text' },
  orgName:     { label:'ชื่อหน่วยงาน',    type:'text' },
  localName:   { label:'ชื่อท้องถิ่น',    type:'text' },
  docNumber:   { label:'เลขที่เอกสาร',   type:'text' },
  sentDate:    { label:'ส่งวันที่',      type:'date' },
  installment: { label:'งวด',           type:'text' },
  amount:      { label:'ยอดเงิน',       type:'number' },
  permitDoc:   { label:'เลขที่หนังสืออนุญาต', type:'text' },
  permitDate:  { label:'ลงวันที่',       type:'date' },
  note:        { label:'หมายเหตุ',      type:'text' },
};

const CHECKLIST_GROUPS = [
  { name:'1. หนังสือส่งมอบทรัพย์สิน', items:[
    { id:'c1', seq:1, label:'หนังสือขอส่งมอบทรัพย์สิน' },
    { id:'c2', seq:2, label:'บัญชีรายการรับมอบทรัพย์สิน' },
  ]},
  { name:'2. สัญญา/BOQ/แบบ/หนังสือค้ำประกัน', items:[
    { id:'c3', seq:3, label:'สัญญา/สัญญาแนบท้าย' },
    { id:'c4', seq:4, label:'ประมาณการ (BOQ)' },
    { id:'c5', seq:5, label:'แบบแปลน (เซ็นต์สัญญา)' },
    { id:'c6', seq:6, label:'หนังสือค้ำประกัน' },
  ]},
  { name:'3. หนังสืออนุญาต', items:[
    { id:'c7', seq:7, label:'หนังสืออนุญาต' },
  ]},
  { name:'4. หนังสือแต่งตั้งคณะกรรมการตรวจ', items:[
    { id:'c8', seq:8, label:'หนังสือแต่งตั้งคณะกรรมการตรวจ (สำเนา กปภ.)' },
  ]},
  { name:'5. หนังสือขอลงมือทำงาน/แจ้งปัญหา/ส่งงาน/หนังสืออื่นๆ', items:[
    { id:'c9', seq:9, label:'หนังสือขอลงมือทำงาน,แจ้งปัญหาอุปสรรค,ส่งงาน และหนังสืออื่นๆ' },
  ]},
  { name:'6. หนังสืออนุมัติใช้ท่อ/อุปกรณ์/อื่นๆ', items:[
    { id:'c10', seq:10, label:'หนังสืออนุมัติใช้ท่อ/อุปกรณ์ /ส่งรายงานผลขออนุมัติใช้' },
  ]},
  { name:'7. ผลทดสอบแรงดันน้ำ/ตัวอย่างท่อ/อื่นๆ (พร้อมใบเสร็จ)', items:[
    { id:'c11', seq:11, label:'ผลทดสอบแรงดันน้ำในเส้นท่อ (พร้อมใบเสร็จ)' },
    { id:'c12', seq:12, label:'ผลทดสอบตัวอย่างท่อ (พร้อมใบเสร็จ)' },
  ]},
  { name:'8. ใบกำกับพัสดุท่อ/อุปกรณ์ต่างๆ', items:[
    { id:'c13', seq:13, label:'ใบกำกับพัสดุท่อ/อุปกรณ์ต่างๆ' },
  ]},
  { name:'9. ภาพถ่ายหน้างาน (ตามงวดงาน)', items:[
    { id:'c14', seq:14, label:'ภาพถ่ายหน้างาน (กรณีป้ายโครงการ 1 รูป /A4)' },
    { id:'c15', seq:15, label:'ภาพการตัดประสานท่อ (ก่อน-หลังตัดประสาน)' },
  ]},
  { name:'10. AS-BUILT forAUTOCAD FILE (CD)', items:[

const CHECKLIST_ITEMS = CHECKLIST_GROUPS.flatMap(g=>g.items);

function ensureChecklist(project){
  if(!Array.isArray(project.checklist)) project.checklist = [];
  const existing = {};
  project.checklist.forEach(c=>{ existing[c.itemId] = true; });
  CHECKLIST_ITEMS.forEach(it=>{
    if(!existing[it.id]){
      project.checklist.push({ id: uid(), itemId: it.id, status:'', note:'' });
    }
  });
}

function checklistCounts(project){
  const items = project.checklist || [];
  const done = items.filter(c=>c.status==='มี'||c.status==='ไม่มี').length;
  const total = CHECKLIST_ITEMS.length;
  return { total, done, waiting: total-done, pending: total-done, pct: Math.round(done/total*100) };
}

function uid(){ return Math.random().toString(36).slice(2,10); }

function emptyProject(name){
  return {
    id: uid(), name: name, createdAt: new Date().toISOString(), budget: '',
    documentCategories: [], permitAgencies: [], purchases: [],
    checklist: CHECKLIST_ITEMS.map(it=>({ id: uid(), itemId: it.id, status:'', note:'' })),
    _loaded: true
  };
}

function emptyDocItem(){
  return { id: uid(), docNumber:'', docDate:'', from:'', to:'', subject:'', sentDate:'', hasReply:false, replyDocNumber:'', replyDate:'' };
}
function emptyPurchaseItem(){
  return { id: uid(), prNo:'', matName:'', prQty:'', prOthQty:'', poQty:'', unit:'', poNo:'', poReceive:'' };
}

async function apiGet(path){
  const res = await fetch(path);
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
async function apiPost(path, body){
  const res = await fetch(path, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}

async function loadState(){
  try{
    const summaries = await apiGet('/api/overview');
    if(Array.isArray(summaries)){
      state = { projects: summaries.map(s=>({
        id: s.id, name: s.name, createdAt: s.createdAt, budget: s.budget,
        documentCategories: [], permitAgencies: [], purchases: [],
        _loaded: false, _summary: s
      })) };
    }
  }catch(e){ /* no data yet, or server not reachable */ }

  // migrate + defend against missing fields (only relevant for already-loaded projects)
  state.projects.forEach(p=>{
    if(!Array.isArray(p.documentCategories)){
      // migrate legacy flat "documents" list into a default category
      if(Array.isArray(p.documents) && p.documents.length){
        p.documentCategories = [{
          id: uid(),
          name: 'เอกสารทั่วไป',
          items: p.documents.map(d=>({
            id: d.id || uid(), docNumber: d.name||'', docDate:'', from:'', to:'', subject:'',
            sentDate: (d.status==='เสร็จสิ้น') ? (d.date||new Date().toISOString().slice(0,10)) : '',
            hasReply:false, replyDocNumber:'', replyDate:''
          }))
        }];
      } else {
        p.documentCategories = [];
      }
      delete p.documents;
    }
    if(!Array.isArray(p.permitAgencies)){
      // migrate legacy flat "permits" list into a single migrated agency block
      if(Array.isArray(p.permits) && p.permits.length){
        p.permitAgencies = [{
          id: uid(),
          agencyType: 'other',
          agencyLabel: 'ย้ายข้อมูลเดิม',
          items: p.permits.map(d=>{
            const approved = d.status==='อนุมัติแล้ว';
            const submitted = approved || d.status==='รออนุมัติ';
            return {
              id: d.id || uid(), orgName: d.name||'', docNumber:'',
              sentDate: submitted ? (d.date||new Date().toISOString().slice(0,10)) : '',
              installment:'', amount:'', permitDoc:'',
              permitDate: approved ? (d.date||new Date().toISOString().slice(0,10)) : '',
              note:''
            };
          })
        }];
      } else {
        p.permitAgencies = [];
      }
      delete p.permits;
    }
    if(!Array.isArray(p.purchases)) p.purchases = [];
    p.purchases = p.purchases.map(it=>{
      if('matName' in it || 'prNo' in it) return it; // already new format
      // migrate legacy simple item {name, qty, date, status}
      const received = it.status==='ของเข้าแล้ว';
      const ordered = received || it.status==='กำลังจัดส่ง';
      return {
        id: it.id || uid(),
        prNo: '', matName: it.name||'', prQty: it.qty||'', prOthQty:'',
        poQty: ordered ? (it.qty||'') : '',
        unit: '',
        poNo: ordered ? 'ย้ายข้อมูลเดิม' : '',
        poReceive: received ? (it.qty||'') : ''
      };
    });
  });
}

async function saveState(){
  const project = state.projects.find(p=>p.id===currentProjectId);
  if(!project) return; // no project currently open — nothing scoped to save (deletion has its own call)
  try{
    const result = await apiPost('/api/save-project', project);
    if(!result || !result.ok) showToast('บันทึกข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง');
  }catch(e){
    showToast('บันทึกข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- Progress helpers ---------- */
function docAllItems(project){
  return project.documentCategories.flatMap(c=>c.items);
}
function docItemState(item){
  if(!item.sentDate) return { label:'รอดำเนินการ', pct:0, cls:'st-none' };
  if(item.hasReply && !item.replyDate) return { label:'รอตอบกลับ', pct:50, cls:'st-prog' };
  return { label:'เรียบร้อย', pct:100, cls:'st-done' };
}
function docCounts(items){
  const c = { total: items.length, done:0, waiting:0, pending:0 };
  items.forEach(it=>{
    const st = docItemState(it);
    if(st.label==='เรียบร้อย') c.done++;
    else if(st.label==='รอตอบกลับ') c.waiting++;
    else c.pending++;
  });
  return c;
}
function docCategoryProgress(project){
  const items = docAllItems(project);
  if(!items.length) return null;
  const sum = items.reduce((a,it)=>a+docItemState(it).pct, 0);
  return Math.round(sum/items.length);
}
function purchaseItemState(item){
  const prOthQty = Number(item.prOthQty)||0;
  if(prOthQty>0) return { label:'เบิกจาก Store', pct:100, cls:'st-done' };
  const poNo = (item.poNo||'').toString().trim();
  if(!poNo) return { label:'รอสั่งซื้อ', pct:0, cls:'st-none' };
  const poQty = Number(item.poQty)||0;
  const poReceive = Number(item.poReceive)||0;
  const complete = poQty>0 ? poReceive>=poQty : poReceive>0;
  if(!complete) return { label:'รอของเข้า', pct:50, cls:'st-prog' };
  return { label:'ของเข้าแล้ว', pct:100, cls:'st-done' };
}
function purchaseCounts(items){
  const c = { total: items.length, done:0, waiting:0, pending:0 };
  items.forEach(it=>{
    const st = purchaseItemState(it);
    if(st.pct===100) c.done++;
    else if(st.pct===50) c.waiting++;
    else c.pending++;
  });
  return c;
}
function purchasesProgress(project){
  const items = project.purchases;
  if(!items.length) return null;
  const sum = items.reduce((a,it)=>a+purchaseItemState(it).pct, 0);
  return Math.round(sum/items.length);
}
function permitAllItems(project){
  return project.permitAgencies.flatMap(a=>a.items);
}
function permitItemState(item){
  if(!item.sentDate) return { label:'ยังไม่ยื่น', pct:0, cls:'st-none' };
  if(!item.permitDate) return { label:'รออนุมัติ', pct:50, cls:'st-prog' };
  return { label:'อนุมัติแล้ว', pct:100, cls:'st-done' };
}
function permitCounts(items){
  const c = { total: items.length, done:0, waiting:0, pending:0 };
  items.forEach(it=>{
    const st = permitItemState(it);
    if(st.label==='อนุมัติแล้ว') c.done++;
    else if(st.label==='รออนุมัติ') c.waiting++;
    else c.pending++;
  });
  return c;
}
function permitsProgress(project){
  const items = permitAllItems(project);
  if(!items.length) return null;
  const sum = items.reduce((a,it)=>a+permitItemState(it).pct, 0);
  return Math.round(sum/items.length);
}
function permitPendingList(project){
  if(!project._loaded && project._summary){
    return project._summary.pendingMoney || [];
  }
  const out = [];
  project.permitAgencies.forEach(block=>{
    const type = AGENCY_TYPES.find(t=>t.key===block.agencyType) || AGENCY_TYPES[AGENCY_TYPES.length-1];
    if(!type.fields.includes('amount')) return;
    block.items.forEach(it=>{
      const st = permitItemState(it);
      if(st.label==='อนุมัติแล้ว') return;
      out.push({
        agency: block.agencyLabel,
        idLabel: it.road || it.orgName || it.localName || '',
        installment: it.installment || '-',
        amount: it.amount,
        status: st.label
      });
    });
  });
  return out;
}
function formatMoney(n){
  if(n===''||n===null||n===undefined||isNaN(n)) return '-';
  return Number(n).toLocaleString('th-TH', { maximumFractionDigits:2 });
}
function allCatProgressList(project){
  if(!project._loaded && project._summary){
    const s = project._summary;
    return [
      { icon:'📄', label:'งานเอกสาร', pct: s.doc.pct, counts: s.doc.total ? s.doc : null, waitingLabel:'รอตอบกลับ' },
      { icon:'🛂', label:'งานขออนุญาต', pct: s.permit.pct, counts: s.permit.total ? s.permit : null, waitingLabel:'รออนุมัติ' },
      { icon:'📦', label:'ของที่ซื้อ/ของที่เข้า', pct: s.purchase.pct, counts: s.purchase.total ? s.purchase : null, waitingLabel:'รอของเข้า', pendingLabel:'ยังไม่มี PO' },
      { icon:'📋', label:'เช็คลิสต์แฟ้มส่งงาน', pct: s.checklist ? s.checklist.pct : null, counts: s.checklist ? { total:s.checklist.total, done:s.checklist.done, waiting:s.checklist.pending } : null, waitingLabel:'ยังไม่ระบุ' }
    ];
  }
  const docItems = docAllItems(project);
  const permitItems = permitAllItems(project);
  const cc = checklistCounts(project);
  return [
    { icon:'📄', label:'งานเอกสาร', pct: docCategoryProgress(project), counts: docItems.length ? docCounts(docItems) : null, waitingLabel:'รอตอบกลับ' },
    { icon:'🛂', label:'งานขออนุญาต', pct: permitsProgress(project), counts: permitItems.length ? permitCounts(permitItems) : null, waitingLabel:'รออนุมัติ' },
    { icon:'📦', label:'ของที่ซื้อ/ของที่เข้า', pct: purchasesProgress(project), counts: project.purchases.length ? purchaseCounts(project.purchases) : null, waitingLabel:'รอของเข้า', pendingLabel:'ยังไม่มี PO' },
    { icon:'📋', label:'เช็คลิสต์แฟ้มส่งงาน', pct: cc.pct, counts: { total:cc.total, done:cc.done, waiting:cc.pending }, waitingLabel:'ยังไม่ระบุ' }
  ];
}
function overallProgress(project){
  const vals = allCatProgressList(project).map(x=>x.pct).filter(v=>v!==null);
  if(!vals.length) return 0;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function barColor(pct){
  if(pct>=70) return 'var(--ok)';
  if(pct>=35) return 'var(--warn)';
  return 'var(--bad)';
}

function resizeHandle(tableKey, colKey){
  return `<span class="col-resizer" data-table="${tableKey}" data-col="${colKey}"></span>`;
}
function thWidthStyle(store, colKey){
  return store[colKey] ? ` style="width:${store[colKey]};"` : '';
}

function renderOverview(){
  const grid = document.getElementById('overviewGrid');
  const summary = document.getElementById('ovSummary');
  summary.textContent = state.projects.length ? `ทั้งหมด ${state.projects.length} โครงการ` : '';

  if(!state.projects.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">ยังไม่มีโครงการ &mdash; กด <b>"+ เพิ่มโครงการ"</b> เพื่อเริ่มต้น</div>`;
    return;
  }

  grid.innerHTML = state.projects.map(p=>{
    const pct = overallProgress(p);
    const rows = allCatProgressList(p).map(c=>{
      const display = c.pct===null ? '—' : c.pct+'%';
      const width = c.pct===null ? 0 : c.pct;
      const color = c.pct===null ? 'var(--line)' : barColor(c.pct);
      const countsLine = c.counts ? `<div class="doc-counts">ทั้งหมด ${c.counts.total} · เรียบร้อย ${c.counts.done} · ${c.waitingLabel} ${c.counts.waiting}${c.pendingLabel? ' · '+c.pendingLabel+' '+c.counts.pending : ''}</div>` : '';
      return `<div class="prow-wrap">
        <div class="prow">
          <span class="lbl">${c.icon} ${c.label}</span>
          <span class="mini-track"><span class="mini-fill" style="width:${width}%;background:${color};"></span></span>
          <span class="val">${display}</span>
        </div>
        ${countsLine}
      </div>`;
    }).join('');
    const pending = permitPendingList(p);
    const pendingHtml = pending.length ? `
      <div class="pending-box">
        <div class="pending-title">รายการที่ยังไม่อนุมัติ (งวด/ยอดเงิน)</div>
        ${pending.map(x=>`<div class="pending-row"><span>${escapeHtml(x.agency)}${x.idLabel? ' ('+escapeHtml(x.idLabel)+')':''}</span><span>งวด ${escapeHtml(String(x.installment))} · ${formatMoney(x.amount)} บาท</span></div>`).join('')}
      </div>
    ` : '';
    return `<div class="pcard" data-id="${p.id}">
      <div class="pcard-top">
        <div>
          <h3>${escapeHtml(p.name)}</h3>
          ${p.budget!=='' && p.budget!==null && p.budget!==undefined ? `<div class="budget-line-sm">ยอดเงิน: ${formatMoney(p.budget)} บาท</div>` : ''}
        </div>
        <span class="pcard-pct">${pct}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${barColor(pct)};"></div></div>
      <div class="pcard-rows">${rows}</div>
      ${pendingHtml}
    </div>`;
  }).join('');

  grid.querySelectorAll('.pcard').forEach(card=>{
    card.addEventListener('click', async ()=>{
      switchTab('detail');
      await openProjectDetail(card.dataset.id);
    });
  });
}

function renderProjectSelect(){
  const sel = document.getElementById('projectSelect');
  if(!state.projects.length){
    sel.innerHTML = `<option>ยังไม่มีโครงการ</option>`;
    sel.disabled = true;

  }
  sel.disabled = false;
  if(!currentProjectId || !state.projects.find(p=>p.id===currentProjectId)){
    currentProjectId = state.projects[0].id;
  }
  sel.innerHTML = state.projects.map(p=>
    `<option value="${p.id}" ${p.id===currentProjectId?'selected':''}>${escapeHtml(p.name)}</option>`

/** เปิดดูรายละเอียดโครงการ — โหลดข้อมูลเต็มจากเซิร์ฟเวอร์เฉพาะครั้งแรกที่เปิด (ครั้งต่อไปใช้ข้อมูลที่โหลดไว้แล้วในหน่วยความจำ) */
async function openProjectDetail(projectId){
  currentProjectId = projectId;
  const project = state.projects.find(p=>p.id===projectId);
  if(project && !project._loaded){
    document.getElementById('detailContent').innerHTML = `<div class="empty">กำลังโหลดข้อมูลโครงการ...</div>`;
    renderProjectSelect();
    try{
      const full = await apiGet('/api/project?id=' + encodeURIComponent(projectId));
      if(full){
        project.name = full.name;
        project.createdAt = full.createdAt;
        project.budget = full.budget;
        project.documentCategories = full.documentCategories;
        project.permitAgencies = full.permitAgencies;
        project.purchases = full.purchases;
        project.checklist = full.checklist || [];
        project._loaded = true;
      }
    }catch(e){
      showToast('โหลดข้อมูลโครงการไม่สำเร็จ ลองใหม่อีกครั้ง');
    }
  }
  if(project) ensureChecklist(project);
  renderDetail();
}

  groups.forEach((groupItems, prNo)=>{
    const groupKey = prNo || '__blank__';
    const label = prNo ? prNo : 'ไม่ระบุ PR No.';
    const displayItems = query ? groupItems.filter(it=>(it.matName||'').toLowerCase().includes(query)) : groupItems;
    if(query && !displayItems.length) return;
    if(query) anyMatch = true;
    const c = purchaseCounts(groupItems);
    const pctLabel = `ทั้งหมด ${c.total} · เรียบร้อย ${c.done} · รอของเข้า ${c.waiting} · ยังไม่มี PO ${c.pending} · ${Math.round((c.done*100+c.waiting*50)/c.total)}%`;
    const matchNote = query ? ` · พบ ${displayItems.length} รายการที่ตรงกับคำค้นหา` : '';
    const collapsed = query ? false : collapsedPurchaseGroups.has(groupKey);
    html += `
      <div class="doc-cat" data-purchase-group="${escapeAttr(groupKey)}">
        <div class="doc-cat-head">
          <h4>
            <button type="button" class="group-toggle" data-group="${escapeAttr(groupKey)}" title="${collapsed?'ขยาย':'ย่อ'}" ${query?'disabled':''}>${collapsed?'▸':'▾'}</button>
            ${escapeHtml(label)} <span class="tag">${groupItems.length} รายการ</span>
          </h4>
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:12px;color:var(--ink-soft);">${pctLabel}${matchNote}</span>
            <button class="btn-danger-text btn-del-purchase-group" data-group="${escapeAttr(groupKey)}" title="ลบทั้งชุด">ลบทั้งชุด</button>

    html += `<div class="no-items">ไม่พบอุปกรณ์ที่ตรงกับ "${escapeHtml(purchaseSearchQuery)}"</div>`;

function attachDetailListeners(project){
  // per-column drag-to-resize (ลากขอบคอลัมน์เพื่อปรับความกว้าง) — shared across doc/permit/purchase tables
  const COL_WIDTH_STORES = { doc: colWidthsDoc, permit: colWidthsPermit, purchase: colWidthsPurchase };
  document.querySelectorAll('.col-resizer').forEach(handle=>{
    handle.addEventListener('pointerdown', e=>{
      e.preventDefault();
      const th = handle.closest('th');
      if(!th) return;
      const startX = e.clientX;
      const startWidth = th.offsetWidth;
      const store = COL_WIDTH_STORES[handle.dataset.table];
      const colKey = handle.dataset.col;
      handle.classList.add('resizing');
      handle.setPointerCapture(e.pointerId);
      function onMove(ev){
        const newWidth = Math.max(50, startWidth + (ev.clientX - startX));
        th.style.width = newWidth + 'px';
      }
      function onUp(ev){
        handle.releasePointerCapture(ev.pointerId);
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        handle.classList.remove('resizing');
        if(store) store[colKey] = th.style.width;
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
    });
  });

  // + เพิ่มหมวด (document category)
  const btnAddDocCat = document.getElementById('btnAddDocCat');
  if(btnAddDocCat){
    btnAddDocCat.addEventListener('click', ()=>openModal('docCategory'));
  }

  // add document item forms (per category)
  document.querySelectorAll('.doc-add-row').forEach(form=>{
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const catId = form.dataset.catId;
      const cat = project.documentCategories.find(c=>c.id===catId);
      const fd = new FormData(form);
      const docNumber = (fd.get('docNumber')||'').trim();
      const subject = (fd.get('subject')||'').trim();
      if(!docNumber && !subject){ showToast('กรุณาใส่เลขที่เอกสารหรือชื่อเรื่อง'); return; }
      const item = emptyDocItem();
      item.docNumber = docNumber;
      item.docDate = fd.get('docDate')||'';
      item.from = (fd.get('from')||'').trim();
      item.to = (fd.get('to')||'').trim();
      item.subject = subject;
      cat.items.push(item);
      await saveState();
      renderDetail();
      renderOverview();
      showToast('เพิ่มรายการเอกสารแล้ว');
    });
  });

  // delete document category
  document.querySelectorAll('.btn-del-cat').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const wrap = btn.closest('.doc-cat');
      const catId = wrap.dataset.catId;
      const cat = project.documentCategories.find(c=>c.id===catId);
      if(!confirm(`ลบหมวด "${cat.name}" และรายการเอกสารทั้งหมดในหมวดนี้ใช่หรือไม่?`)) return;
      project.documentCategories = project.documentCategories.filter(c=>c.id!==catId);
      await saveState();
      renderDetail();
      renderOverview();
      showToast('ลบหมวดแล้ว');
    });
  });

  // document item rows
  document.querySelectorAll('tr[data-doc-item-id]').forEach(row=>{
    const catId = row.dataset.catId;
    const itemId = row.dataset.docItemId;
    const cat = project.documentCategories.find(c=>c.id===catId);
    const item = cat.items.find(it=>it.id===itemId);

    const bind = (sel, field, evt='change')=>{
      const el = row.querySelector(sel);
      if(!el) return;
      el.addEventListener(evt, async e=>{
        item[field] = e.target.value.trim ? e.target.value.trim() : e.target.value;
        await saveState();
        renderOverview();
      });
    };
    bind('.f-docnumber','docNumber');
    bind('.f-from','from');
    bind('.f-to','to');
    bind('.f-subject','subject');

    const docDateEl = row.querySelector('.f-docdate');
    if(docDateEl) docDateEl.addEventListener('change', async e=>{
      item.docDate = e.target.value; await saveState();
    });
    const sentDateEl = row.querySelector('.f-sentdate');
    if(sentDateEl) sentDateEl.addEventListener('change', async e=>{
      item.sentDate = e.target.value; await saveState(); renderDetail(); renderOverview();
    });
    const hasReplyEl = row.querySelector('.f-hasreply');
    if(hasReplyEl) hasReplyEl.addEventListener('change', async e=>{
      item.hasReply = e.target.checked;
      if(!item.hasReply) item.replyDate = '';
      await saveState();
      renderDetail();
      renderOverview();
    });
    const replyNumEl = row.querySelector('.f-replynum');
    if(replyNumEl) replyNumEl.addEventListener('change', async e=>{
      item.replyDocNumber = e.target.value.trim(); await saveState();
    });
    const replyDateEl = row.querySelector('.f-replydate');
    if(replyDateEl) replyDateEl.addEventListener('change', async e=>{
      item.replyDate = e.target.value;
      await saveState();
      renderDetail();
      renderOverview();
    });
    row.querySelector('.f-del-doc').addEventListener('click', async ()=>{
      if(!confirm('ลบรายการเอกสารนี้ใช่หรือไม่?')) return;
      cat.items = cat.items.filter(it=>it.id!==itemId);
      await saveState();
      renderDetail();
      renderOverview();
      showToast('ลบรายการแล้ว');
    });
  });

  // + เพิ่มหน่วยงาน (permit agency)
  const btnAddAgency = document.getElementById('btnAddAgency');
  if(btnAddAgency){
    btnAddAgency.addEventListener('click', ()=>{
      const panel = document.getElementById('addAgencyPanel');
      panel.style.display = panel.style.display==='none' ? 'flex' : 'none';
    });
  }
  const agencyTypeSelect = document.getElementById('newAgencyType');
  if(agencyTypeSelect){
    agencyTypeSelect.addEventListener('change', e=>{
      document.getElementById('newAgencyCustomName').style.display = e.target.value==='other' ? 'block' : 'none';
    });
  }
  const btnCancelAddAgency = document.getElementById('btnCancelAddAgency');
  if(btnCancelAddAgency){
    btnCancelAddAgency.addEventListener('click', ()=>{
      document.getElementById('addAgencyPanel').style.display = 'none';
    });
  }
  const btnConfirmAddAgency = document.getElementById('btnConfirmAddAgency');
  if(btnConfirmAddAgency){
    btnConfirmAddAgency.addEventListener('click', async ()=>{
      const typeKey = document.getElementById('newAgencyType').value;
      const type = AGENCY_TYPES.find(t=>t.key===typeKey);
      let label = type.label;
      if(typeKey==='other'){
        const customName = document.getElementById('newAgencyCustomName').value.trim();
        if(!customName){ showToast('กรุณาระบุชื่อหน่วยงาน'); return; }
        label = customName;
      }
      project.permitAgencies.push({ id: uid(), agencyType: typeKey, agencyLabel: label, items: [] });
      await saveState();
      renderDetail();
      renderOverview();
      showToast('เพิ่มหน่วยงานแล้ว');
    });
  }

  // delete permit agency block
  document.querySelectorAll('.btn-del-agency').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const wrap = btn.closest('.doc-cat');
      const agencyId = wrap.dataset.agencyId;
      const block = project.permitAgencies.find(a=>a.id===agencyId);
      if(!confirm(`ลบหน่วยงาน "${block.agencyLabel}" และรายการทั้งหมดในหน่วยงานนี้ใช่หรือไม่?`)) return;
      project.permitAgencies = project.permitAgencies.filter(a=>a.id!==agencyId);
      await saveState();
      renderDetail();
      renderOverview();
      showToast('ลบหน่วยงานแล้ว');
    });
  });

  // add permit item forms (per agency block)
  document.querySelectorAll('.permit-add-row').forEach(form=>{
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const agencyId = form.dataset.agencyId;
      const block = project.permitAgencies.find(a=>a.id===agencyId);
      const type = AGENCY_TYPES.find(t=>t.key===block.agencyType) || AGENCY_TYPES[AGENCY_TYPES.length-1];
      const fd = new FormData(form);
      const item = { id: uid() };
      type.fields.forEach(f=>{
        if(f==='sentDate' || f==='permitDate'){ item[f] = ''; return; }
        const meta = PERMIT_FIELD_META[f];
        const raw = (fd.get(f)||'').toString().trim();
        item[f] = meta.type==='number' ? (raw? parseFloat(raw) : '') : raw;
      });
      const idField = type.fields.find(f=>['road','orgName','localName'].includes(f));
      const idVal = idField ? item[idField] : '';
      if(!idVal && !item.docNumber){ showToast('กรุณากรอกข้อมูลอย่างน้อยหนึ่งช่อง'); return; }
      block.items.push(item);
      await saveState();
      renderDetail();
      renderOverview();
      showToast('เพิ่มรายการแล้ว');
    });
  });

  // permit item rows
  document.querySelectorAll('tr[data-permit-item-id]').forEach(row=>{
    const agencyId = row.dataset.agencyId;
    const itemId = row.dataset.permitItemId;
    const block = project.permitAgencies.find(a=>a.id===agencyId);
    const item = block.items.find(it=>it.id===itemId);
    const type = AGENCY_TYPES.find(t=>t.key===block.agencyType) || AGENCY_TYPES[AGENCY_TYPES.length-1];

    type.fields.forEach(f=>{
      const el = row.querySelector('.f-permit-'+f);
      if(!el) return;
      el.addEventListener('change', async e=>{
        const meta = PERMIT_FIELD_META[f];
        const raw = e.target.value;
        item[f] = meta.type==='number' ? (raw===''? '' : parseFloat(raw)) : raw;
        await saveState();
        if(f==='sentDate' || f==='permitDate'){
          renderDetail();
        }
        renderOverview();
      });
    });

    row.querySelector('.f-del-permit').addEventListener('click', async ()=>{
      if(!confirm('ลบรายการนี้ใช่หรือไม่?')) return;
      block.items = block.items.filter(it=>it.id!==itemId);
      await saveState();
      renderDetail();
      renderOverview();
      showToast('ลบรายการแล้ว');
    });
  });

  // Excel import / template download (purchases)
  const btnImportExcel = document.getElementById('btnImportExcel');
  const excelFileInput = document.getElementById('excelFileInput');
  if(btnImportExcel && excelFileInput){
    btnImportExcel.addEventListener('click', ()=> excelFileInput.click());
    excelFileInput.addEventListener('change', async e=>{
      const file = e.target.files[0];
      excelFileInput.value = '';
      if(!file) return;
      if(typeof XLSX === 'undefined'){
        showToast('โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ ลองใหม่อีกครั้ง');
        return;
      }
      try{
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data, { type:'array', cellDates:true });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval:'', raw:true });
        let count = 0;
        rows.forEach(row=>{
          const matName = pickField(row, ['Mat.Name','MatName','Mat Name','matName']);
          const prNo = pickField(row, ['PR No.','PR No','prNo']);
          // skip blank rows and PR group-header rows (PR No. only, no Mat.Name) and title rows
          if(!String(matName).trim()) return;
          project.purchases.push({
            id: uid(),
            prNo: String(prNo||'').trim(),
            matName: String(matName).trim(),
            prQty: parseImportedNumber(pickField(row, ['PR QTY','PrQty'])),
            prOthQty: parseImportedNumber(pickField(row, ['PR OTH QTY','PR OTH.QTY'])),
            poQty: parseImportedNumber(pickField(row, ['P/O QTY','PO QTY'])),
            unit: String(pickField(row, ['Unit','unit'])||'').trim(),
            poNo: String(pickField(row, ['PO No.','PO No'])||'').trim(),
            poReceive: parseImportedNumber(pickField(row, ['PO Receive','PO_Receive']))
          });
          count++;
        });
        if(!count){ showToast('ไม่พบข้อมูลที่นำเข้าได้ในไฟล์นี้ ตรวจสอบว่ามีคอลัมน์ Mat.Name'); return; }
        await saveState();
        renderDetail();
        renderOverview();
        showToast(`นำเข้าแล้ว ${count} รายการ`);
      }catch(err){
        showToast('ไม่สามารถอ่านไฟล์นี้ได้ ตรวจสอบรูปแบบไฟล์');
      }
    });
  }
  const btnDownloadTemplate = document.getElementById('btnDownloadTemplate');
  if(btnDownloadTemplate){
    btnDownloadTemplate.addEventListener('click', ()=>{
      if(typeof XLSX === 'undefined'){ showToast('โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
      const wsData = [
        PURCHASE_FIELDS.map(f=>PURCHASE_FIELD_META[f].header),
        ['PR202602116','ท่อ HDPE PN 6 ขนาด 315 มม.', 3500, 0, 3500, 'เมตร', 'PO202605031', 840]
      ];
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'รายการสั่งซื้อ');
      XLSX.writeFile(wb, 'เทมเพลต-รายการของที่ซื้อ.xlsx');
    });
  }

  // purchases add form
  const purchaseAddRow = document.getElementById('purchaseAddRow');
  if(purchaseAddRow){
    purchaseAddRow.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(purchaseAddRow);
      const matName = (fd.get('matName')||'').toString().trim();
      const prNo = (fd.get('prNo')||'').toString().trim();
      if(!matName && !prNo){ showToast('กรุณากรอกข้อมูลอย่างน้อยหนึ่งช่อง'); return; }
      const item = emptyPurchaseItem();
      item.prNo = prNo;
      item.matName = matName;
      item.prQty = parseImportedNumber(fd.get('prQty'));
      item.prOthQty = parseImportedNumber(fd.get('prOthQty'));
      item.unit = (fd.get('unit')||'').toString().trim();
      project.purchases.push(item);
      await saveState();
      renderDetail();
      renderOverview();
      showToast('เพิ่มรายการแล้ว');
    });
  }

  // Mat.Name search
  const purchaseSearchInput = document.getElementById('purchaseSearchInput');
  if(purchaseSearchInput){
    purchaseSearchInput.addEventListener('input', e=>{
      purchaseSearchQuery = e.target.value;
      const cursorPos = e.target.selectionStart;
      renderDetail();
      const newInput = document.getElementById('purchaseSearchInput');
      if(newInput){
        newInput.focus();
        newInput.setSelectionRange(cursorPos, cursorPos);
      }
    });
  }
  const btnClearPurchaseSearch = document.getElementById('btnClearPurchaseSearch');
  if(btnClearPurchaseSearch){
    btnClearPurchaseSearch.addEventListener('click', ()=>{
      purchaseSearchQuery = '';
      renderDetail();
    });
  }

  // purchase group toggle (ย่อ/ขยาย)
  document.querySelectorAll('.group-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.group;
      if(collapsedPurchaseGroups.has(key)) collapsedPurchaseGroups.delete(key);
      else collapsedPurchaseGroups.add(key);
      renderDetail();
    });
  });

  // delete an entire PR No. group
  document.querySelectorAll('.btn-del-purchase-group').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.group;
      const label = key==='__blank__' ? 'ไม่ระบุ PR No.' : key;
      if(!confirm(`ลบชุด "${label}" และรายการทั้งหมดในชุดนี้ใช่หรือไม่?`)) return;
      project.purchases = project.purchases.filter(it=>{
        const itKey = (it.prNo||'').toString().trim() || '__blank__';
        return itKey !== key;
      });
      collapsedPurchaseGroups.delete(key);
      await saveState();
      renderDetail();
      renderOverview();
      showToast('ลบชุดแล้ว');
    });
  });

  // purchase item rows
  document.querySelectorAll('tr[data-purchase-item-id]').forEach(row=>{
    const itemId = row.dataset.purchaseItemId;
    const item = project.purchases.find(it=>it.id===itemId);

    PURCHASE_FIELDS.forEach(f=>{
      const el = row.querySelector('.f-purchase-'+f);
      if(!el) return;
      el.addEventListener('change', async e=>{
        const meta = PURCHASE_FIELD_META[f];
        const raw = e.target.value;
        item[f] = meta.type==='number' ? parseImportedNumber(raw) : raw;
        await saveState();
        if(f==='poNo' || f==='poQty' || f==='poReceive' || f==='prNo' || f==='prOthQty'){
          renderDetail();
        }
        renderOverview();
      });
    });

    row.querySelector('.f-del-purchase').addEventListener('click', async ()=>{
      if(!confirm('ลบรายการนี้ใช่หรือไม่?')) return;
      project.purchases = project.purchases.filter(it=>it.id!==itemId);
      await saveState();
      renderDetail();
      renderOverview();
      showToast('ลบรายการแล้ว');
    });
  });

  // checklist rows
  document.querySelectorAll('tr[data-checklist-item-id]').forEach(row=>{
    const itemId = row.dataset.checklistItemId;
    let record = project.checklist.find(c=>c.itemId===itemId);
    if(!record){
      record = { id: uid(), itemId, status:'', note:'' };
      project.checklist.push(record);
    }
    row.querySelectorAll('.chk-status-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const clicked = btn.dataset.status;
        record.status = (record.status===clicked) ? '' : clicked;
        await saveState();
        renderDetail();
        renderOverview();
      });
    });
    const noteEl = row.querySelector('.f-checklist-note');
    if(noteEl){
      noteEl.addEventListener('change', async e=>{
        record.note = e.target.value;
        await saveState();
      });
    }
  });
}

/* ---------- Project select / new / delete ---------- */
document.getElementById('projectSelect').addEventListener('change', async e=>{
  await openProjectDetail(e.target.value);
});

document.getElementById('btnDeleteProject').addEventListener('click', async ()=>{
  const project = state.projects.find(p=>p.id===currentProjectId);
  if(!project) return;
  if(!confirm(`ลบโครงการ "${project.name}" และข้อมูลทั้งหมดในโครงการนี้ใช่หรือไม่?`)) return;
  const idToDelete = project.id;
  state.projects = state.projects.filter(p=>p.id!==currentProjectId);
  currentProjectId = null;
  try{
    const result = await apiPost('/api/delete-project', { id: idToDelete });
    if(!result || !result.ok) showToast('ลบโครงการไม่สำเร็จ ลองใหม่อีกครั้ง');
  }catch(e){
    showToast('ลบโครงการไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
  renderDetail();
  renderOverview();
  showToast('ลบโครงการแล้ว');
});

/* ---------- Modal (shared: new project / new doc category) ---------- */
function openModal(mode){
  modalMode = mode;
  const title = document.getElementById('modalTitle');
  const input = document.getElementById('modalInput');
  const budgetInput = document.getElementById('modalBudgetInput');
  if(mode==='project'){
    title.textContent = 'ชื่อโครงการใหม่';
    input.placeholder = 'เช่น โครงการก่อสร้างอาคาร A';
    budgetInput.style.display = 'block';
    budgetInput.value = '';
  } else {
    title.textContent = 'ชื่อหมวดเอกสารใหม่';
    input.placeholder = 'เช่น หมวดขอลงมือทำงาน, หมวดขออนุมัติใช้';
    budgetInput.style.display = 'none';
  }
  input.value = '';
  document.getElementById('modalBg').classList.add('active');
  input.focus();
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('active');
}
document.getElementById('btnNewProjectOv').addEventListener('click', ()=>openModal('project'));
document.getElementById('btnNewProjectDetail').addEventListener('click', ()=>openModal('project'));
document.getElementById('btnCancelModal').addEventListener('click', closeModal);
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

async function confirmModal(){
  const name = document.getElementById('modalInput').value.trim();
  if(!name){ showToast('กรุณากรอกข้อมูลก่อน'); return; }

  if(modalMode==='project'){
    const budgetRaw = document.getElementById('modalBudgetInput').value;
    const p = emptyProject(name);
    p.budget = budgetRaw ? parseFloat(budgetRaw) : '';
    state.projects.push(p);
    currentProjectId = p.id;
    await saveState();
    closeModal();
    renderOverview();
    renderDetail();
    showToast('เพิ่มโครงการแล้ว');
  } else {
    const project = state.projects.find(p=>p.id===currentProjectId);
    if(!project) return;
    project.documentCategories.push({ id: uid(), name, items: [] });
    await saveState();
    closeModal();
    renderDetail();
    renderOverview();
    showToast('เพิ่มหมวดเอกสารแล้ว');
  }
}
document.getElementById('btnConfirmModal').addEventListener('click', confirmModal);
document.getElementById('modalInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') confirmModal();
});

/* ---------- Tabs ---------- */
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('view-overview').classList.toggle('active', tab==='overview');
  document.getElementById('view-detail').classList.toggle('active', tab==='detail');
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    switchTab(btn.dataset.tab);
    if(btn.dataset.tab==='detail'){
      if(currentProjectId) await openProjectDetail(currentProjectId);
      else renderDetail();
    }
  });
});

function pickField(row, keys){
  for(const k of keys){
    if(row[k]!==undefined && row[k]!=='') return row[k];
  }
  const rowKeys = Object.keys(row);
  for(const k of keys){
    const found = rowKeys.find(rk=>rk.trim()===k.trim());
    if(found && row[found]!=='') return row[found];
  }
  return '';
}
function parseImportedNumber(v){
  if(v===''||v===null||v===undefined) return '';
  const n = typeof v==='number' ? v : parseFloat(String(v).replace(/,/g,'').trim());
  return isNaN(n) ? '' : n;
}

/* ---------- Utils ---------- */
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* ---------- Init ---------- */
(async function init(){
  await loadState();
  renderOverview();
  renderDetail();
})();
</script>
